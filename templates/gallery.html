<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ designer }} - {{ season }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #000;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
        }

        .header a {
            color: #666;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .header a:hover {
            color: #000;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .season {
            font-size: 0.875rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .image-item {
            aspect-ratio: 2 / 3;
            overflow: hidden;
            cursor: pointer;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        .image-item:hover img {
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 1rem;
            opacity: 0.7;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev {
            left: 1rem;
        }

        .lightbox-next {
            right: 1rem;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/">&larr; Back to Dashboard</a>
        <h1>{{ designer }}</h1>
        <div class="season">{{ season }}</div>
    </div>

    {% if not images_by_category %}
    <div class="empty-state">No images downloaded yet.</div>
    {% else %}
        {% for category, images in images_by_category.items() %}
        <section class="category-section">
            <h2>{{ category }} ({{ images|length }})</h2>
            <div class="image-grid">
                {% for src in images %}
                <div class="image-item" onclick="openLightbox('{{ category }}', {{ loop.index0 }})">
                    <img src="{{ src }}" loading="lazy" alt="">
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    {% endif %}

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); navigateLightbox(-1)">&lsaquo;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); navigateLightbox(1)">&rsaquo;</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <script>
        const imagesByCategory = {{ images_by_category | tojson }};
        let currentCategory = null;
        let currentIndex = 0;

        function openLightbox(category, index) {
            currentCategory = category;
            currentIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('lightbox').classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function navigateLightbox(delta) {
            const images = imagesByCategory[currentCategory];
            currentIndex = (currentIndex + delta + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            const images = imagesByCategory[currentCategory];
            document.getElementById('lightbox-img').src = images[currentIndex];
            document.getElementById('lightbox-counter').textContent =
                `${currentIndex + 1} / ${images.length} (${currentCategory})`;
        }

        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });
    </script>
</body>
</html>
